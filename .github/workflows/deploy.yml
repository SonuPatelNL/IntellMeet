name: Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  docker-build-and-push:
    name: Build Docker Images & Prep Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Stubs for registry login - can be configured with credentials later
      # - name: Log in to Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.server
          push: false # Set to true once registry credentials are configured
          tags: intellmeet-backend:latest

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.web
          push: false
          tags: intellmeet-frontend:latest

      - name: Build and Push AI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.ai
          push: false
          tags: intellmeet-ai:latest

      # Dry-run validation of Kubernetes Manifests to verify structure
      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating k8s configurations..."
          # In real pipelines, run: kubectl diff -f deployment/kubernetes/ or similar
          test -f deployment/kubernetes/backend.yaml && echo "Backend manifest found"
          test -f deployment/kubernetes/frontend.yaml && echo "Frontend manifest found"
          echo "Deployment configurations verified successfully."
