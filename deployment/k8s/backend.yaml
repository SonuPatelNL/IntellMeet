apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellmeet-backend
  labels:
    app: intellmeet-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intellmeet-backend
  template:
    metadata:
      labels:
        app: intellmeet-backend
    spec:
      containers:
        - name: backend
          image: intellmeet/backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: intellmeet-config
            - secretRef:
                name: intellmeet-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2

---
# Service for backend
apiVersion: v1
kind: Service
metadata:
  name: intellmeet-backend
spec:
  selector:
    app: intellmeet-backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP

---
# Horizontal Pod Autoscaler for backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intellmeet-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intellmeet-backend
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
