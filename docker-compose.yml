version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: intellmeet-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - intellmeet-network
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: intellmeet-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - intellmeet-network
    restart: always

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.server
    container_name: intellmeet-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/intellmeet
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=super_secret_access_token_key_change_in_prod
      - JWT_REFRESH_SECRET=super_secret_refresh_token_key_change_in_prod
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb
      - redis
    networks:
      - intellmeet-network
    restart: always

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.web
    container_name: intellmeet-frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - intellmeet-network
    restart: always

volumes:
  mongodb_data:
  redis_data:

networks:
  intellmeet-network:
    driver: bridge
